[project]
name = "ims-metagpt"
version = "0.1.0"
description = "MetaGPT 多 Agent 软件团队 — 自动生成进销存管理系统（IMS）全栈代码"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Software Team", email = "dev@ims-metagpt.example.com" },
]

dependencies = [
    "metagpt>=0.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ims-metagpt = "ims_metagpt.main:app"

[project.urls]
Homepage = "https://github.com/example/ims-metagpt"
Documentation = "https://github.com/example/ims-metagpt#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
